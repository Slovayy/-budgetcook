<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BudgetCook</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f7f7;
      color: #171717;
    }

    .app {
      max-width: 430px;
      margin: auto;
      min-height: 100vh;
      background: white;
      padding: 25px;
    }

    h1 {
      font-size: 38px;
      margin-top: 50px;
    }

    p {
      color: #666;
      line-height: 1.5;
    }

    label {
      display: block;
      font-weight: bold;
      margin-top: 25px;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 15px;
      border: 1px solid #ddd;
      border-radius: 12px;
      font-size: 17px;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 25px;
      border: none;
      border-radius: 13px;
      background: #111;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    .meal {
      padding: 16px;
      margin-top: 12px;
      background: #f5f5f5;
      border-radius: 14px;
    }

    .meal strong {
      display: block;
      margin-bottom: 6px;
    }

    .price {
      color: #666;
    }

    .result {
      margin-top: 25px;
      padding: 20px;
      background: #f5f5f5;
      border-radius: 15px;
    }
  </style>
</head>

<body>

<div class="app">

  <h2>🍝 BudgetCook</h2>
  <p>Mange bien. Dépense moins.</p>

  <h1>Ton menu.<br>Ton budget.</h1>

  <p>
    Crée une semaine de repas adaptée à ton budget.
  </p>

  <label>💰 Ton budget</label>
  <input id="budget" type="number" value="50">

  <label>👥 Nombre de personnes</label>
  <input id="people" type="number" value="1" min="1">

  <label>🏠 Ce que tu as déjà</label>
  <input id="ingredients" type="text"
         placeholder="Pâtes, riz, œufs, thon...">

  <button onclick="generateMenu()">
    ✨ Générer ma semaine
  </button>

  <div id="result"></div>

</div>

<script>

function generateMenu() {

  let budget = Number(document.getElementById("budget").value);
  let people = Number(document.getElementById("people").value);

  if (!budget || budget <= 0) {
    alert("Entre ton budget !");
    return;
  }

  let cost = Math.min(budget * 0.85, budget);

  let meals = [

    ["LUNDI", "🍝 Pâtes au thon et tomates", "6,20 €"],

    ["MARDI", "🍗 Poulet, riz et légumes", "8,40 €"],

    ["MERCREDI", "🥚 Omelette + pommes de terre", "5,10 €"],

    ["JEUDI", "🌯 Wraps au poulet", "7,30 €"],

    ["VENDREDI", "🍳 Riz sauté aux œufs", "5,40 €"],

    ["SAMEDI", "🍗 Poulet rôti + pommes de terre", "6,80 €"],

    ["DIMANCHE", "🍝 Pâtes crémeuses au poulet", "7,60 €"]

  ];

  let html = "";

  html += "<div class='result'>";

  html += "<h2>🍽️ Ta semaine</h2>";

  meals.forEach(function(meal) {

    html += `
      <div class="meal">

        <strong>${meal[0]}</strong>

        ${meal[1]}

        <div class="price">
          ≈ ${meal[2]}
        </div>

      </div>
    `;

  });

  html += `
    <br>

    <h2>🛒 Budget</h2>

    <p>
      Budget : <strong>${budget.toFixed(2)} €</strong>
    </p>

    <p>
      Courses estimées :
      <strong>${cost.toFixed(2)} €</strong>
    </p>

    <p>
      💰 Il te resterait :
      <strong>${(budget - cost).toFixed(2)} €</strong>
    </p>

  `;

  html += "</div>";

  document.getElementById("result").innerHTML = html;

}

</script>

</body>
</html>
